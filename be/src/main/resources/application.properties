spring.application.name=trungthu
server.port=8080

# Datasource Configuration (H2 In-Memory for local development)
spring.datasource.url=jdbc:h2:mem:trungthudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
# Base64 encoded 256-bit+ key
jwt.secret=dHJ1bmd0aHUtc2Fhcy1wbGF0Zm9ybS1zZWNyZXQta2V5LTIwMjYtbW9vbmNha2Utc2VjdXJpdHkta2V5Cg==
jwt.access-token-exp-minutes=15
jwt.refresh-token-exp-days=7

# Cookie Properties
app.cookie.secure=false
app.cookie.same-site=Lax
app.cookie.domain=

# OpenAPI Swagger Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
