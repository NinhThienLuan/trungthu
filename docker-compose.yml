services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trungthu
      POSTGRES_USER: trungthu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trungthu -d trungthu"]
      interval: 5s
      timeout: 5s
      retries: 12

  be:
    build:
      context: ./be
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trungthu
      SPRING_DATASOURCE_USERNAME: trungthu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      APP_DEMO_SEED: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-change-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-change-me}
      MAIL_USERNAME: ${MAIL_USERNAME:-change-me@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:8080"

volumes:
  postgres_data:
